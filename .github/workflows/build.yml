name: Build VST3

on:
  push:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows
          - os: macos-latest
            name: macos
    runs-on: ${{ matrix.os }}
    name: ${{ matrix.name }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure (Windows)
        if: runner.os == ‘Windows’
        run: cmake -S DMF_ECHO_flat -B build -G «Visual Studio 17 2022» -A x64
      - name: Configure (macOS)
        if: runner.os == ‘macOS’
        run: cmake -S DMF_ECHO_flat -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES=«arm64;x86_64»
      - name: Build
        run: cmake —build build —config Release —target DMF_ECHO_VST3 —parallel
      - uses: actions/upload-artifact@v4
        with:
          name: DMF_ECHO-VST3-${{ matrix.name }}
          path: build/DMF_ECHO_artefacts/Release/VST3/
          if-no-files-found: error
